<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;font-family:system-ui,sans-serif;background:#eef1f4;color:#14181f;display:flex;flex-direction:column}
header{background:#fff;padding:14px 16px 0;border-bottom:1px solid #d5dbe4}
.t{font-size:13px;color:#4a5363}.h{font-size:24px;font-weight:700;margin:2px 0 12px}
.days{display:flex;gap:4px}.d{flex:1;text-align:center;padding:8px 0 10px;font-size:15px;font-weight:600;color:#4a5363;border-bottom:4px solid transparent}
.d i{display:block;height:6px;border-radius:3px;margin:0 8px 6px}
.d.on{color:#14181f;border-color:#A87410}
main{flex:1;padding:20px 16px;position:relative}
.line{position:absolute;left:39px;top:28px;bottom:120px;width:8px;background:#A87410;border-radius:4px}
.st{display:flex;gap:16px;margin-bottom:22px;position:relative}
.dot{width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid #A87410;flex:none;margin-left:11px;margin-top:6px}
.past .dot{border-color:#c9b48a}.past{opacity:.55}
.card{background:#fff;border-radius:10px;padding:12px 14px;flex:1;border:1px solid #d5dbe4}
.next .card{border:2px solid #14181f}
.time{font:700 28px ui-monospace,monospace}.c{font-size:17px;font-weight:600;margin:2px 0}.m{font-size:15px;color:#4a5363}
.b{display:inline-flex;gap:6px;margin-top:8px}.b span{width:30px;height:30px;border-radius:50%;background:#14181f;color:#fff;font:700 14px ui-monospace,monospace;display:grid;place-items:center}
.tag{font-size:13px;font-weight:700;color:#A87410}
nav{display:flex;background:#fff;border-top:1px solid #d5dbe4;height:68px}nav div{flex:1;text-align:center;padding-top:12px;font-size:13px;color:#4a5363}nav .on{color:#14181f;font-weight:700}
</style></head><body>
<header><div class="t">Cong. Norte Villa Diego · Semana del 14 de octubre</div><div class="h">Viernes 18</div>
<div class="days"><div class="d"><i style="background:#6B6F76"></i>Mié</div><div class="d"><i style="background:#3D63A6"></i>Jue</div><div class="d on"><i style="background:#A87410"></i>Vie</div><div class="d"><i style="background:#4A7A2C"></i>Sáb</div><div class="d"><i style="background:#1F7A8C"></i>Dom</div></div></header>
<main><div class="line"></div>
<div class="st past"><div class="dot"></div><div class="card"><div class="time">09:00</div><div class="c">Casa de Ana Pérez</div><div class="m">Conduce Luis M. · Grupos 1 y 2</div></div></div>
<div class="st next"><div class="dot"></div><div class="card"><div class="tag">Próxima · en 40 min</div><div class="time">10:30</div><div class="c">San Martín y Rivadavia</div><div class="m">Conduce Carlos R. · Grupo 3</div><div class="b"><span>12</span><span>14</span></div></div></div>
<div class="st"><div class="dot"></div><div class="card"><div class="time">17:30</div><div class="c">Salón del Reino</div><div class="m">Conduce Jorge S. · Todos</div><div class="b"><span>7</span></div></div></div>
</main>
<nav><div class="on">Salidas</div><div>Mapa</div><div>Carrito</div><div>Programa</div></nav>
</body></html>
